<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#000000" />
<title>eez.world</title>
<meta name="description" content="eez.world. Drift through the void, eat the dots, keep growing. The apps live at eez.world/eez and eez.world/unet." />
<meta property="og:title" content="eez.world" />
<meta property="og:description" content="Drift through the void, eat the dots, keep growing." />
<meta property="og:url" content="https://eez.world/" />
<meta property="og:type" content="website" />
<link rel="icon" href="eez/icons/eez.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #000; color: #F2F2F5;
    font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    overflow: hidden;
  }
  /* The bjvfi void: layered rings and a soft light well, plus a vignette. */
  .void { position: fixed; inset: 0; overflow: hidden; background: #000; }
  .void::before {
    content: ""; position: absolute; inset: 0;
    background:
      repeating-conic-gradient(from 0deg at 50% 50%,
        rgba(255,255,255,.012) 0deg 1deg,
        transparent 1deg 2deg),
      repeating-radial-gradient(circle at 50% 50%,
        rgba(255,255,255,.010) 0px 1px,
        transparent 1px 4px),
      radial-gradient(circle at 50% 50%,
        #000 0%, #000 6%, #010101 11%, #050505 18%, #0d0d0d 26%,
        #161616 36%, #1f1f1f 48%, #262626 62%, #1f1f1f 78%,
        #0d0d0d 92%, #030303 100%);
    background-size: auto, auto, cover;
    pointer-events: none;
  }
  .void::after {
    content: ""; position: absolute; inset: 0; z-index: 3;
    background: radial-gradient(circle at 50% 50%,
      transparent 0%, transparent 40%,
      rgba(0,0,0,.35) 75%, rgba(0,0,0,.95) 100%);
    pointer-events: none;
  }
  canvas { position: absolute; inset: 0; z-index: 1; display: block; touch-action: none; cursor: crosshair; }
  .hud {
    position: absolute; z-index: 4; pointer-events: none;
    text-shadow: 0 0 18px rgba(0,0,0,.9);
  }
  .mark {
    top: 22px; left: 26px; font-size: 1.35rem; font-weight: 500; letter-spacing: -.05em;
  }
  .mark small { display: block; margin-top: 6px; font-size: .72rem; color: #8a8f9c; letter-spacing: 0; font-weight: 400; }
  .score { top: 22px; right: 26px; text-align: right; font-size: .85rem; color: #c9ccd4; }
  .score b { color: #fff; font-weight: 700; }
</style>
</head>
<body>
<div class="void">
  <canvas id="game" aria-label="A small game. Move to drift through the void and eat dots to grow."></canvas>
  <div class="hud mark">eez.world<small>move to drift. eat the dots. keep growing.</small></div>
  <div class="hud score">size <b id="size">10</b> · eaten <b id="eaten">0</b></div>
</div>
<script>
(function () {
  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");
  var sizeEl = document.getElementById("size");
  var eatenEl = document.getElementById("eaten");

  var W = 0, H = 0, DPR = 1;
  var pellets = [];
  var player = { x: 0, y: 0, r: 14 };
  var target = null;               // where the light is heading
  var eaten = 0;
  var keys = {};
  var MAX_R = 120;

  function pelletCount() { return Math.max(60, Math.min(150, Math.round(W * H / 15000))); }
  function newPellet() {
    return {
      x: 24 + Math.random() * Math.max(10, W - 48),
      y: 24 + Math.random() * Math.max(10, H - 48),
      r: 3 + Math.random() * 4,
      warm: Math.random() < 0.16    // a few warm dots among the pale ones
    };
  }
  function seed() {
    pellets = [];
    var n = pelletCount();
    for (var i = 0; i < n; i++) pellets.push(newPellet());
  }
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    if (!player.x && !player.y) { player.x = W / 2; player.y = H / 2; }
    player.x = Math.max(player.r, Math.min(W - player.r, player.x));
    player.y = Math.max(player.r, Math.min(H - player.r, player.y));
    seed();
  }
  window.addEventListener("resize", resize);

  window.addEventListener("pointermove", function (e) { target = { x: e.clientX, y: e.clientY }; });
  window.addEventListener("pointerdown", function (e) { target = { x: e.clientX, y: e.clientY }; });
  window.addEventListener("keydown", function (e) { keys[e.key.toLowerCase()] = true; });
  window.addEventListener("keyup", function (e) { keys[e.key.toLowerCase()] = false; });

  function step() {
    // The orb itself travels, the way the bjvfi light follows you around.
    if (!target) target = { x: player.x, y: player.y };
    var stepPx = 16;
    if (keys["arrowleft"] || keys["a"]) target.x -= stepPx;
    if (keys["arrowright"] || keys["d"]) target.x += stepPx;
    if (keys["arrowup"] || keys["w"]) target.y -= stepPx;
    if (keys["arrowdown"] || keys["s"]) target.y += stepPx;
    target.x = Math.max(0, Math.min(W, target.x));
    target.y = Math.max(0, Math.min(H, target.y));
    player.x += (target.x - player.x) * 0.07;
    player.y += (target.y - player.y) * 0.07;
    player.x = Math.max(player.r, Math.min(W - player.r, player.x));
    player.y = Math.max(player.r, Math.min(H - player.r, player.y));

    // Eating: touch a dot, grow a little, a new dot appears somewhere.
    for (var i = 0; i < pellets.length; i++) {
      var p = pellets[i];
      var dx = p.x - player.x, dy = p.y - player.y;
      var rr = player.r + p.r * 0.4;
      if (dx * dx + dy * dy < rr * rr) {
        if (player.r < MAX_R) player.r = Math.min(MAX_R, Math.sqrt(player.r * player.r + p.r * p.r * 0.55));
        eaten++;
        pellets[i] = newPellet();
        sizeEl.textContent = Math.round(player.r * 2);
        eatenEl.textContent = eaten;
      }
    }
  }

  function draw() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);

    // The dots sit still on the void. Only the light moves.
    for (var i = 0; i < pellets.length; i++) {
      var p = pellets[i];
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = p.warm ? "rgba(255,196,110,0.9)" : "rgba(230,233,240,0.75)";
      ctx.fill();
    }

    // The player: a soft light well with a bright core, the bjvfi glow.
    var glow = ctx.createRadialGradient(player.x, player.y, 0, player.x, player.y, player.r * 4.2);
    glow.addColorStop(0, "rgba(255,255,255,0.20)");
    glow.addColorStop(0.5, "rgba(255,255,255,0.05)");
    glow.addColorStop(1, "rgba(255,255,255,0)");
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.r * 4.2, 0, Math.PI * 2);
    ctx.fillStyle = glow;
    ctx.fill();
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
    ctx.fillStyle = "#F2F2F5";
    ctx.fill();
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.r * 0.62, 0, Math.PI * 2);
    ctx.fillStyle = "#ffffff";
    ctx.fill();
  }

  function frame() {
    step();
    draw();
    requestAnimationFrame(frame);
  }
  resize();
  sizeEl.textContent = Math.round(player.r * 2);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
